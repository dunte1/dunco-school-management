<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#grad1)"/>
  <g fill="white">
    <!-- Robot head -->
    <rect x="120" y="160" width="272" height="200" rx="40" fill="white" opacity="0.9"/>
    <rect x="140" y="180" width="232" height="160" rx="30" fill="white"/>
    
    <!-- Eyes -->
    <circle cx="200" cy="240" r="25" fill="#667eea"/>
    <circle cx="312" cy="240" r="25" fill="#667eea"/>
    <circle cx="200" cy="240" r="12" fill="white"/>
    <circle cx="312" cy="240" r="12" fill="white"/>
    
    <!-- Mouth -->
    <rect x="220" y="280" width="72" height="8" rx="4" fill="#667eea"/>
    
    <!-- Antenna -->
    <circle cx="256" cy="140" r="8" fill="#ff6b9d"/>
    <rect x="252" y="140" width="8" height="20" fill="#ff6b9d"/>
  </g>
</svg> 