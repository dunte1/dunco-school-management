name: CI

on:
  push:
    branches: [ main, master, audit-baseline ]
  pull_request:
    branches: [ main, master ]

jobs:
  migrate-sqlite:
    name: Fresh migrate + seed (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, ctype, json, tokenizer, pdo_sqlite, sqlite3, pdo, openssl, curl, gd, zip, intl
          tools: composer:v2

      - name: Copy env
        run: cp .env.example .env

      - name: Prepare sqlite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Fresh migrate + seed (sqlite)
        run: php artisan migrate:fresh --force --seed

  laravel-tests:
    name: Laravel tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, ctype, json, tokenizer, pdo_sqlite, sqlite3, pdo, openssl, curl, gd, zip, intl
          tools: composer:v2

      - name: Copy env
        run: cp .env.example .env

      - name: Prepare sqlite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  migrate-mysql:
    name: Fresh migrate (mysql)
    runs-on: ubuntu-latest
    # NOTE: Non-blocking until Phase 4 (database consolidation) removes the
    # duplicate/conflicting migrations and foreign-key ordering issues.
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dunco_school
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, ctype, json, tokenizer, pdo_mysql, pdo, openssl, curl, gd, zip, intl
          tools: composer:v2

      - name: Copy env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Fresh migrate (mysql)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dunco_school
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --force

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
