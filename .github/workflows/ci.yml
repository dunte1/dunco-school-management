name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dunco_school
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, ctype, json, tokenizer, pdo, openssl, curl, gd, zip, intl
          tools: composer:v2

      - name: Copy env
        run: |
          cp .env.example .env
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Configure DB
        run: |
          php -r '
            $env = file_get_contents(".env");
            $env = str_replace([
              "DB_CONNECTION=sqlite",
              "DB_DATABASE=${DATABASE}",
              "DB_USERNAME=root",
              "DB_PASSWORD="
            ], [
              "DB_CONNECTION=mysql",
              "DB_DATABASE=dunco_school",
              "DB_USERNAME=root",
              "DB_PASSWORD=root"
            ], $env);
            file_put_contents(".env", $env);
          '

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build assets
        run: npm run build

      - name: Run frontend tests
        run: npm test || echo "No frontend tests defined"
